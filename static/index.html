<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Analyst Agent</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 220px; box-sizing: border-box; font-family: monospace; }
  button { margin-top: 1rem; padding: .5rem 1.2rem; }
  pre { background: #f4f4f4; padding: 1rem; white-space: pre-wrap; word-break: break-word; }
</style>
</head>
<body>
<h1>Data Analyst Agent</h1>
<label for="questions"><b>Questions</b> (what you would put in questions.txt)</label>
<textarea id="questions" placeholder="Describe the analysis you want, and the format of the answer..."></textarea>
<p><label><b>Data files</b> (optional)<br><input id="files" type="file" multiple></label></p>
<button id="run">Run analysis</button>
<p id="status"></p>
<pre id="out" hidden></pre>
<script>
document.getElementById("run").onclick = async () => {
  const questions = document.getElementById("questions").value.trim();
  const status = document.getElementById("status");
  const out = document.getElementById("out");
  if (!questions) { status.textContent = "Please type your questions first."; return; }

  const fd = new FormData();
  fd.append("questions", questions);
  for (const f of document.getElementById("files").files) fd.append(f.name, f);  // field name = file name

  status.textContent = "Running... this can take a few minutes.";
  out.hidden = true;
  try {
    const res = await fetch("/api", { method: "POST", body: fd });
    const body = await res.text();
    let shown = body;
    try { const data = JSON.parse(body); shown = typeof data === "string" ? data : JSON.stringify(data, null, 2); } catch {}
    status.textContent = res.ok ? "Done." : "Error " + res.status;
    out.textContent = shown;
    out.hidden = false;
  } catch (e) {
    status.textContent = "Request failed: " + e;
  }
};
</script>
</body>
</html>
